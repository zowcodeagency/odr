<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Odr · Captain</title>
    <meta name="theme-color" content="#fbfbfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17181d" media="(prefers-color-scheme: dark)" />

    <script>
      // Resolve the theme before first paint: stored choice, else the OS.
      try {
        var t = localStorage.getItem("odr.theme");
        document.documentElement.dataset.theme =
          t === "light" || t === "dark"
            ? t
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch (e) {}
      // Replay the owner's branding (snapshotted by lib/branding.ts) on the
      // same frame, so a branded device never flashes stock Odr colours.
      try {
        var p = JSON.parse(localStorage.getItem("odr.brandingPaint") || "null");
        if (p) {
          var r = document.documentElement;
          r.style.cssText = p.css;
          if (p.theme) r.dataset.theme = p.theme;
          if (p.style) r.dataset.style = p.style;
          if (p.font) {
            var l = document.createElement("link");
            l.id = "odr-brand-font";
            l.rel = "stylesheet";
            l.href = p.font;
            document.head.appendChild(l);
          }
        }
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />

    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
