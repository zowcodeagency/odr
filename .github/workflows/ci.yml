name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

      # The front-ends must still build — a broken bundle fails here, not in
      # front of a restaurant.
      - run: bun run build:web
        env:
          DINER_ORIGIN: https://order.example.invalid
